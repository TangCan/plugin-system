[package]
name = "plugctx-examples"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Runnable demos for plugctx (not published; workspace examples package)"

[features]
default = []
# 重能力：按需开启，避免默认检查拉 Extism/wasmtime
wasm = ["plugctx/dynamic-wasm"]
component = ["plugctx/dynamic-wasm-component"]
native = ["plugctx/dynamic-native"]
web = ["dep:tiny_http"]

[dependencies]
tiny_http = { version = "0.12", optional = true }

[dev-dependencies]
plugctx = { workspace = true }
plugctx-derive = { path = "../crates/plugctx-derive", version = "0.1.1" }

[[example]]
name = "derive-plugin"
path = "derive-plugin.rs"

[[example]]
name = "component-add"
path = "component-add.rs"
required-features = ["component"]

[[example]]
name = "wasm-echo"
path = "wasm-echo.rs"
required-features = ["wasm"]

[[example]]
name = "cli-hotplug"
path = "cli-hotplug.rs"
required-features = ["native"]

[[example]]
name = "web-service"
path = "web-service.rs"
required-features = ["web"]

[[example]]
name = "game-loop"
path = "game-loop.rs"
