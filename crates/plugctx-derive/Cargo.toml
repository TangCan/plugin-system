[package]
name = "plugctx-derive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional proc-macro helpers for the plugctx plugin framework (FR27)"
authors.workspace = true
documentation = "https://docs.rs/plugctx-derive"
readme.workspace = true
repository.workspace = true

[lib]
